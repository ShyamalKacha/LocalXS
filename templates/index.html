<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalXS</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
  
  <!-- Header Bar -->
  <header class="app-header glass">
    <div class="logo-section">
      <span class="logo-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><line x1="5" y1="7.5" x2="14" y2="7.5"/><line x1="5" y1="12" x2="14" y2="12"/><line x1="5" y1="16.5" x2="14" y2="16.5"/><circle cx="17" cy="7.5" r="1" fill="currentColor"/><circle cx="17" cy="12" r="1" fill="currentColor"/><circle cx="17" cy="16.5" r="1" fill="currentColor"/></svg></span>
      <a href="#" class="logo-text">LocalXS</a>
    </div>
    <div class="user-info">
      <a href="/logout" class="btn btn-secondary btn-logout">Logout</a>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-container">
    
    <!-- Toolbar: Breadcrumbs, Search, Actions, View, Sort -->
    <div class="toolbar glass">
      <div id="breadcrumb" class="breadcrumb">
        <a href="#" class="breadcrumb-item">Root</a>
      </div>
      
      <div class="controls">
        <!-- Search bar -->
        <div class="search-wrapper">
          <span class="search-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input id="search-input" class="form-control search-input" type="text" placeholder="Search..." autocomplete="off">
        </div>
        
        <!-- Action Buttons -->
        <button id="upload-btn" class="btn btn-primary"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Upload</button>
        <button id="create-folder-btn" class="btn btn-secondary"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> New Folder</button>
        <input type="file" id="upload-input" style="display: none;">
        
        <!-- Sorting -->
        <select id="sort-select" class="select-control">
          <option value="name-asc">A-Z</option>
          <option value="name-desc">Z-A</option>
          <option value="size-asc">Size (Small)</option>
          <option value="size-desc">Size (Large)</option>
        </select>
        
        <!-- View Toggle -->
        <div class="view-toggle">
          <button id="view-grid-btn" class="view-btn active" title="Grid View"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
          <button id="view-list-btn" class="view-btn" title="List View"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
        </div>
      </div>
    </div>

    <!-- Upload Progress bar (Sticky top inline) -->
    <div id="upload-progress-container" class="upload-progress-container" style="display: none;">
      <span>Uploading...</span>
      <div class="upload-progress-bar">
        <div id="upload-progress-fill" class="upload-progress-fill"></div>
      </div>
      <span id="upload-progress-percent">0%</span>
    </div>

    <!-- Dynamic Files List Container -->
    <div id="files-container" class="files-container">
      <!-- Loaded dynamically via app.js -->
    </div>

  </main>

  <!-- Storage Meter Footer -->
  <footer class="app-footer">
    <div class="storage-bar-wrap">
      <div class="storage-bar-bg">
        <div id="storage-bar-fill" class="storage-bar-fill"></div>
      </div>
      <div id="storage-text" class="storage-text">Loading storage usage...</div>
    </div>
  </footer>

  <!-- File Drop Overlay -->
  <div id="drop-overlay" class="drop-overlay">
    <span class="drop-overlay-icon"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
    <h2 class="drop-overlay-text">Drop files here to upload</h2>
  </div>

  <!-- Modal: Media Preview overlay -->
  <div id="preview-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">File Preview</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Rendered based on file type -->
      </div>
    </div>
  </div>

  <!-- Modal: Generic Action forms (create folder, rename, confirm delete) -->
  <div id="action-modal" class="modal-overlay">
    <div class="modal-content modal-content-narrow">
      <div class="modal-header">
        <h3 id="action-modal-title" class="modal-title">Action</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div id="action-modal-body" class="modal-body">
        <!-- Dynamic form content -->
      </div>
    </div>
  </div>

  <!-- Floating Toast Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
