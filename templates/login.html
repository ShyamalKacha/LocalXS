<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LocalXS</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass">
      <div class="auth-logo"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><line x1="5" y1="7.5" x2="14" y2="7.5"/><line x1="5" y1="12" x2="14" y2="12"/><line x1="5" y1="16.5" x2="14" y2="16.5"/><circle cx="17" cy="7.5" r="1.2" fill="currentColor"/><circle cx="17" cy="12" r="1.2" fill="currentColor"/><circle cx="17" cy="16.5" r="1.2" fill="currentColor"/></svg> LocalXS</div>
      <div class="auth-subtitle">Local Cross-Platform Sharing</div>
      
      {% if error %}
      <div class="error-msg">
        {{ error }}
      </div>
      {% endif %}
      
      <form action="/login" method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        
        <button class="btn btn-primary auth-btn-block" type="submit">
          Secure Login
        </button>
      </form>
    </div>
  </div>
</body>
</html>
