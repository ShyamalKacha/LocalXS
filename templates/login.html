<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Premium Media Cloud</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2002/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass">
      <div class="auth-logo">Media Server</div>
      <div class="auth-subtitle">Secure Filesharing & Streaming Portal</div>
      
      {% if error %}
      <div class="error-msg">
        {{ error }}
      </div>
      {% endif %}
      
      <form action="/login" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        
        <button class="btn btn-primary auth-btn-block" type="submit">
          Secure Login
        </button>
      </form>
    </div>
  </div>
</body>
</html>
